repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15 # Use the latest stable Ruff version
    hooks:
      # 1. Run the linter
      - id: ruff-check
        args: [--fix] # Automatically fixes safe lint errors (like unused imports)

      # 2. Run the formatter
      - id: ruff-format
